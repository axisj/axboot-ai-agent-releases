name: Promote Latest Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to promote, for example v0.2.57
        required: true
        type: string
      confirm_tag:
        description: Type the same tag again to confirm latest promotion
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: promote-latest-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote release to latest
    runs-on: ubuntu-latest

    steps:
      - name: Validate input
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          CONFIRM_TAG="${{ inputs.confirm_tag }}"

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v0.2.57. Received: $TAG" >&2
            exit 1
          fi

          if [[ "$TAG" != "$CONFIRM_TAG" ]]; then
            echo "confirm_tag must exactly match tag." >&2
            exit 1
          fi

      - name: Load release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          ENCODED_TAG="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$TAG")"
          API_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/releases/tags/${ENCODED_TAG}"

          HTTP_STATUS="$(
            curl -sS -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o release.json \
              -w "%{http_code}" \
              "$API_URL"
          )"

          if [[ "$HTTP_STATUS" == "404" ]]; then
            echo "Release $TAG does not exist. Run the prerelease workflow first." >&2
            exit 1
          fi

          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "Failed to load release $TAG: HTTP $HTTP_STATUS" >&2
            cat release.json >&2
            exit 1
          fi

          RELEASE_ID="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('release.json','utf8')); process.stdout.write(String(r.id));")"
          IS_DRAFT="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('release.json','utf8')); process.stdout.write(String(r.draft));")"
          ASSET_COUNT="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('release.json','utf8')); process.stdout.write(String((r.assets || []).length));")"

          if [[ "$IS_DRAFT" == "true" ]]; then
            echo "Release $TAG is still a draft. Publish the prerelease before promoting it to latest." >&2
            exit 1
          fi

          if [[ "$ASSET_COUNT" == "0" ]]; then
            echo "Release $TAG has no assets. Refusing to promote an empty release." >&2
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Verify required assets
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"

          node - "$VERSION" <<'NODE'
          const fs = require('fs');
          const version = process.argv[2];
          const release = JSON.parse(fs.readFileSync('release.json', 'utf8'));
          const assets = new Set((release.assets || []).map((asset) => asset.name));
          const required = [
            `AXBOOT-AI-${version}-mac-universal.dmg`,
            `AXBOOT-AI-${version}-mac-universal.zip`,
            `AXBOOT-AI-${version}-mac-universal.zip.blockmap`,
            'latest-mac.yml',
            `AXBOOT-AI-${version}-windows-x64.exe`,
            `AXBOOT-AI-${version}-windows-x64.exe.blockmap`,
            'latest.yml',
          ];
          const missing = required.filter((name) => !assets.has(name));
          if (missing.length > 0) {
            console.error(`Release v${version} is missing required asset(s): ${missing.join(', ')}`);
            process.exit(1);
          }
          console.log(`Verified ${required.length} required release asset(s).`);
          NODE

      - name: Promote release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          RELEASE_ID="${{ steps.release.outputs.release_id }}"
          API_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"

          node - "$TAG" > promote-payload.json <<'NODE'
          const tag = process.argv[2];
          process.stdout.write(JSON.stringify({
            tag_name: tag,
            name: tag,
            draft: false,
            prerelease: false,
            make_latest: 'true',
          }));
          NODE

          curl -sS -L \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data @promote-payload.json \
            "$API_URL" > promoted-release.json

          echo "Promoted $TAG to stable latest."

      - name: Verify latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ inputs.tag }}"
          API_URL="${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/releases/latest"

          curl -sS -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$API_URL" > latest-release.json

          LATEST_TAG="$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('latest-release.json','utf8')); process.stdout.write(r.tag_name || '');")"

          if [[ "$LATEST_TAG" != "$TAG" ]]; then
            echo "Latest verification failed. Expected $TAG, got $LATEST_TAG." >&2
            cat latest-release.json >&2
            exit 1
          fi

          echo "Latest release is now $TAG."
