name: Promote latest prerelease

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Specific prerelease tag to promote. Leave empty to use the latest public prerelease."
        required: false
        type: string
      dry_run:
        description: "Show the selected release without updating it."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: promote-latest-prerelease
  cancel-in-progress: false

jobs:
  promote:
    name: Promote release
    runs-on: ubuntu-latest

    steps:
      - name: Select latest public prerelease
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          all_releases="[]"
          page=1

          while true; do
            page_json="$(gh api "repos/${GH_REPO}/releases?per_page=100&page=${page}")"
            page_count="$(jq 'length' <<<"${page_json}")"

            if [[ "${page_count}" == "0" ]]; then
              break
            fi

            all_releases="$(jq -s '.[0] + .[1]' <(printf '%s' "${all_releases}") <(printf '%s' "${page_json}"))"
            page=$((page + 1))
          done

          if [[ -n "${INPUT_TAG}" ]]; then
            release_json="$(gh api "repos/${GH_REPO}/releases/tags/${INPUT_TAG}")"
          else
            release_json="$(
              jq '
                map(
                  select(
                    .draft == false
                    and .prerelease == true
                    and (.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].*)?$"))
                  )
                )
                | sort_by(
                    .tag_name
                    | capture("^v?(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?:[-+].*)?$")
                    | [.major, .minor, .patch]
                    | map(tonumber)
                  )
                | last
              ' <<<"${all_releases}"
            )"
          fi

          if [[ -z "${release_json}" || "${release_json}" == "null" ]]; then
            {
              echo "skip=true"
              echo "skip_reason=No public prerelease was found."
            } >> "${GITHUB_OUTPUT}"

            echo "No public prerelease was found. Nothing to promote."
            exit 0
          fi

          release_id="$(jq -r '.id' <<<"${release_json}")"
          tag_name="$(jq -r '.tag_name' <<<"${release_json}")"
          draft="$(jq -r '.draft' <<<"${release_json}")"
          prerelease="$(jq -r '.prerelease' <<<"${release_json}")"

          if [[ "${draft}" != "false" ]]; then
            echo "Release ${tag_name} is a draft and cannot be promoted to latest." >&2
            exit 1
          fi

          if [[ "${prerelease}" != "true" ]]; then
            echo "Release ${tag_name} is not a prerelease." >&2
            exit 1
          fi

          latest_release_json="$(
            jq '
              map(
                select(
                  .draft == false
                  and .prerelease == false
                  and (.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+(?:[-+].*)?$"))
                )
              )
              | sort_by(
                  .tag_name
                  | capture("^v?(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?:[-+].*)?$")
                  | [.major, .minor, .patch]
                  | map(tonumber)
                )
              | last
            ' <<<"${all_releases}"
          )"

          selected_version="$(jq -r '.tag_name | capture("^v?(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?:[-+].*)?$") | [.major, .minor, .patch] | map(tonumber) | @tsv' <<<"${release_json}")"
          IFS=$'\t' read -r selected_major selected_minor selected_patch <<<"${selected_version}"

          if [[ -n "${latest_release_json}" && "${latest_release_json}" != "null" ]]; then
            latest_tag_name="$(jq -r '.tag_name' <<<"${latest_release_json}")"
            latest_version="$(jq -r '.tag_name | capture("^v?(?<major>[0-9]+)\\.(?<minor>[0-9]+)\\.(?<patch>[0-9]+)(?:[-+].*)?$") | [.major, .minor, .patch] | map(tonumber) | @tsv' <<<"${latest_release_json}")"
            IFS=$'\t' read -r latest_major latest_minor latest_patch <<<"${latest_version}"

            if (( latest_major > selected_major )) \
              || (( latest_major == selected_major && latest_minor > selected_minor )) \
              || (( latest_major == selected_major && latest_minor == selected_minor && latest_patch >= selected_patch )); then
              {
                echo "release_id=${release_id}"
                echo "tag_name=${tag_name}"
                echo "skip=true"
                echo "skip_reason=Current latest ${latest_tag_name} is newer than or equal to selected prerelease ${tag_name}."
              } >> "${GITHUB_OUTPUT}"

              echo "Current latest ${latest_tag_name} is newer than or equal to selected prerelease ${tag_name}. Nothing to promote."
              exit 0
            fi
          fi

          {
            echo "release_id=${release_id}"
            echo "tag_name=${tag_name}"
            echo "skip=false"
          } >> "${GITHUB_OUTPUT}"

          echo "Selected ${tag_name} (${release_id})"

      - name: Promote selected release to latest
        if: ${{ !inputs.dry_run && steps.select.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.select.outputs.release_id }}
          TAG_NAME: ${{ steps.select.outputs.tag_name }}
        run: |
          set -euo pipefail

          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            --field draft=false \
            --field prerelease=false \
            --silent

          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${RELEASE_ID}" \
            --raw-field make_latest=true \
            --silent

          echo "Promoted ${TAG_NAME} to latest."

      - name: Dry run summary
        if: ${{ inputs.dry_run && steps.select.outputs.skip != 'true' }}
        run: |
          echo "Dry run: would promote ${{ steps.select.outputs.tag_name }} to latest."

      - name: Skip summary
        if: ${{ steps.select.outputs.skip == 'true' }}
        run: |
          echo "${{ steps.select.outputs.skip_reason }}"
